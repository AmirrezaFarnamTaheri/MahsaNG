name: MahsaNG safety checks

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-kotlin-regressions:
    name: Pure Kotlin regressions (real JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run isolated production helper tests
        working-directory: V2rayNG
        run: ./gradlew -p pure-tests --no-daemon test

  android-compile:
    name: Android source build (no suppressed errors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install declared Android SDK
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Compile Android application
        working-directory: V2rayNG
        run: ./gradlew --no-daemon :app:compileDevDebugKotlin
